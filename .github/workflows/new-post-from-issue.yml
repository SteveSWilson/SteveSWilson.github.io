name: Draft post from "New Blog Post" issue

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  draft-post:
    if: contains(github.event.issue.labels.*.name, 'new-post')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Parse issue into a post file
        id: post
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body || "";

            function escapeRegExp(s) {
              return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            }

            function getField(label) {
              const re = new RegExp(
                `### ${escapeRegExp(label)}\\s*\\n+([\\s\\S]*?)(?=\\n### |$)`
              );
              const m = body.match(re);
              if (!m) return "";
              const val = m[1].trim();
              return (val === "_No response_") ? "" : val;
            }

            const title = getField("Post Title");
            const category = getField("Category (optional)");
            const excerpt = getField("Short summary (optional)");
            const content = getField("Post Content");

            if (!title || !content) {
              core.setFailed("Missing required title or content.");
              return;
            }

            const now = new Date();
            const iso = now.toISOString().slice(0, 10);
            const slug = title
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/(^-|-$)/g, "")
              .slice(0, 60) || "post";

            const filename = `_posts/${iso}-${slug}-${context.issue.number}.md`;

            // Remove any earlier draft from a previous edit of this same issue.
            if (fs.existsSync('_posts')) {
              for (const f of fs.readdirSync('_posts')) {
                if (f.endsWith(`-${context.issue.number}.md`) && f !== filename.split('/')[1]) {
                  fs.unlinkSync(`_posts/${f}`);
                }
              }
            }

            const lines = [
              "---",
              "layout: post",
              `title:  ${JSON.stringify(title)}`,
              `date:   ${iso} 12:00:00 -0000`,
            ];
            if (category) lines.push(`category: ${JSON.stringify(category)}`);
            if (excerpt) lines.push(`excerpt: ${JSON.stringify(excerpt)}`);
            lines.push("---", "", content, "");

            fs.mkdirSync('_posts', { recursive: true });
            fs.writeFileSync(filename, lines.join("\n"));

            core.setOutput("filename", filename);
            core.setOutput("branch", `post/issue-${context.issue.number}`);
            core.setOutput("post_title", title);

      - name: Set up Ruby
        if: steps.post.outputs.filename
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Validate the site still builds
        if: steps.post.outputs.filename
        run: bundle exec jekyll build

      - name: Commit post and open pull request
        if: steps.post.outputs.filename
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.post.outputs.branch }}
          FILENAME: ${{ steps.post.outputs.filename }}
          POST_TITLE: ${{ steps.post.outputs.post_title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A _posts
          git commit -m "New post: $POST_TITLE" || echo "Nothing new to commit"
          git push -u origin "$BRANCH" --force

          if ! gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --title "New post: $POST_TITLE" \
              --body "Closes #$ISSUE_NUMBER

          Auto-drafted from issue #$ISSUE_NUMBER. Click **Merge pull request** below to publish it to the live site." \
              --base main \
              --head "$BRANCH"
          fi

          echo "PR_URL=$(gh pr view "$BRANCH" --json url -q .url)" >> "$GITHUB_ENV"

      - name: Comment with a link to review/publish
        if: steps.post.outputs.filename
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Your post looks good! I've drafted it here: ${process.env.PR_URL}\n\nOpen that link and click the green **Merge pull request** button whenever you're ready to publish. Your site will update automatically within a couple of minutes after that.`
            });

      - name: Comment if something went wrong
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "Something went wrong turning this into a post — this can happen with unusual characters in the title. Try simplifying the title, then edit this issue (just open it and save it again) to retry. If it keeps happening, let Steve know."
            });
