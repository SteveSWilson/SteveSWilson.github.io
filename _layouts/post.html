---
layout: default
---
<div class="wrap entry">
  <a class="back-link" href="{{ '/' | relative_url }}">&larr; Back to all posts</a>
  <div class="entry-header">
    <div class="post-meta">
      {% if page.category %}<span>{{ page.category }}</span><span class="dot">&middot;</span>{% endif %}
      <span>{{ page.date | date: "%B %-d, %Y" }}</span>
    </div>
    <h1>{{ page.title }}</h1>
  </div>
  <div class="entry-content">
    {{ content }}
  </div>
</div>
